services:
  - type: web
    name: crm-fastapi-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
